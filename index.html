<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BTC Strategy Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#080d18;color:#eaf0ff;font:14px system-ui,-apple-system}main{max-width:1250px;margin:auto;padding:12px}.box{background:#111a2c;border:1px solid #263653;border-radius:14px;padding:14px;margin-bottom:10px}h1{margin:0;font-size:22px}.muted{color:#92a3c5}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}label{display:flex;gap:5px;align-items:center}input,button{background:#18243a;color:#fff;border:1px solid #385075;border-radius:8px;padding:8px}button{font-weight:700}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.stat{background:#0c1424;border-radius:9px;padding:9px}.stat b{display:block;font-size:15px;margin-top:3px}canvas{width:100%;height:560px;display:block;touch-action:none}.events{max-height:240px;overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #263653;text-align:right}td:first-child,th:first-child{text-align:left}.err{color:#ff9b9b}.good{color:#5ed6aa}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.stats .stat:first-child{grid-column:1/3}canvas{height:440px}td,th{padding:6px 3px;font-size:12px}}</style></head><body><main>
<section class="box"><h1>BTC Strategy Lab <span class="muted">v0.4c Replay</span></h1><div class="muted">Bitstamp BTC/USD · 只用當時已知資料逐週重播支撐區</div><div class="controls"><label>Pivot <input id="L" type="number" value="5" min="2"></label><label>ATR <input id="N" type="number" value="14" min="2"></label><label>Zone ATR <input id="Z" type="number" value=".8" step=".1"></label><label>Break ATR <input id="B" type="number" value=".5" step=".1"></label><button onclick="calc()">重新計算</button><button onclick="allView()">全部歷史</button><button onclick="recent()">近 8 年</button></div></section>
<section class="box stats"><div class="stat">資料範圍<b id="range">載入中</b></div><div class="stat">日 K<b id="days">—</b></div><div class="stat">週 K<b id="weeks">—</b></div><div class="stat">Zone 建立<b id="zones">—</b></div><div class="stat">目前 Zone<b id="current">—</b></div></section>
<section class="box"><canvas id="c"></canvas><div id="msg" class="muted">載入 BTC 歷史資料…</div></section>
<section class="box"><b>Zone 事件紀錄</b><div class="events"><table><thead><tr><th>日期</th><th>事件</th><th>下緣</th><th>上緣</th><th>收盤</th></tr></thead><tbody id="log"></tbody></table></div></section>
</main><script>
const DATA='https://raw.githubusercontent.com/alessiostomeo/btc-cycle-data/main/bitstamp/1day/BTCUSD_bitstamp_daily_2012-2026.csv',q=x=>document.getElementById(x);let W=[],R=[],E=[],V=[0,0],drag;
function parse(t){let l=t.trim().split(/\r?\n/),h=l.shift().split(',').map(x=>x.trim().toLowerCase()),f=n=>h.findIndex(x=>x===n||x.includes(n)),ti=f('timestamp'),di=f('date'),oi=f('open'),hi=f('high'),li=f('low'),ci=f('close'),vi=f('volume');return l.map(s=>{let a=s.split(','),r=ti>=0?a[ti]:a[di],tt=/^\d+$/.test(r)?+r:new Date(r).getTime()/1000;if(tt>1e12)tt/=1000;return{t:tt,o:+a[oi],h:+a[hi],l:+a[li],c:+a[ci],v:vi>=0?+a[vi]:0}}).filter(x=>x.t&&isFinite(x.c)).sort((a,b)=>a.t-b.t)}
function week(a){let o=[],u;for(let x of a){let d=new Date(x.t*1000),k=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()-((d.getUTCDay()+6)%7))/1000;if(!u||u.t!==k){u={...x,t:k};o.push(u)}else{u.h=Math.max(u.h,x.h);u.l=Math.min(u.l,x.l);u.c=x.c;u.v+=x.v}}return o}
function atr(a,n){let z=a.map((x,i)=>i?Math.max(x.h-x.l,Math.abs(x.h-a[i-1].c),Math.abs(x.l-a[i-1].c)):x.h-x.l),r=Array(a.length).fill(NaN),s=0;for(let i=0;i<z.length;i++){if(i<n){s+=z[i];if(i==n-1)r[i]=s/n}else r[i]=(r[i-1]*(n-1)+z[i])/n}return r}
function date(t){return new Date(t*1000).toISOString().slice(0,10)} function money(x){return isFinite(x)?'$'+Math.round(x).toLocaleString():'—'}
function calc(){let L=+q('L').value,n=+q('N').value,w=+q('Z').value,b=+q('B').value,A=atr(W,n),cand=NaN,top=NaN,bot=NaN;E=[];R=W.map(x=>({...x,top:NaN,bot:NaN}));
for(let i=0;i<W.length;i++){let p=i-L,pl=NaN;if(p>=L){let ok=1;for(let j=p-L;j<=p+L;j++)if(j!=p&&W[j].l<=W[p].l){ok=0;break}if(ok)pl=W[p].l}
if(isFinite(pl)&&isFinite(A[p])){let a=A[p];if(!isFinite(cand))cand=pl;else if(Math.abs(pl-cand)<=a*w){top=Math.max(pl,cand)+a*w*.3;bot=Math.min(pl,cand)-a*w*.3;cand=NaN;E.push({t:W[i].t,type:'建立/更新',top,bot,c:W[i].c})}else cand=pl}
if(isFinite(bot)&&isFinite(A[i])&&W[i].c<bot-A[i]*b){E.push({t:W[i].t,type:'失效',top,bot,c:W[i].c});top=bot=cand=NaN}R[i].top=top;R[i].bot=bot}
q('zones').textContent=E.filter(x=>x.type!='失效').length;let last=R.at(-1);q('current').textContent=isFinite(last.bot)?money(last.bot)+'–'+money(last.top):'無';q('log').innerHTML=E.slice().reverse().map(x=>'<tr><td>'+date(x.t)+'</td><td class="'+(x.type=='失效'?'err':'good')+'">'+x.type+'</td><td>'+money(x.bot)+'</td><td>'+money(x.top)+'</td><td>'+money(x.c)+'</td></tr>').join('');draw()}
function draw(){let c=q('c'),d=devicePixelRatio||1,r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;let g=c.getContext('2d');g.scale(d,d);let s=Math.max(0,Math.floor(V[0])),e=Math.min(R.length-1,Math.ceil(V[1])),a=R.slice(s,e+1);if(!a.length)return;let lo=Math.min(...a.map(x=>x.l)),hi=Math.max(...a.map(x=>x.h)),p=(hi-lo)*.06;lo-=p;hi+=p;let X=i=>48+(i-s)/(e-s||1)*(r.width-63),Y=v=>15+(hi-v)/(hi-lo)*(r.height-45);g.strokeStyle='#24324c';g.fillStyle='#92a3c5';g.font='11px system-ui';for(let k=0;k<6;k++){let v=lo+(hi-lo)*k/5,y=Y(v);g.beginPath();g.moveTo(48,y);g.lineTo(r.width-15,y);g.stroke();g.fillText(Math.round(v).toLocaleString(),2,y+4)}
let seg=null;g.fillStyle='rgba(55,120,255,.25)';for(let i=s;i<=e;i++){let x=R[i];if(!isFinite(x.top)){if(seg){g.fillRect(X(seg.a),Y(seg.t),X(i-1)-X(seg.a),Y(seg.b)-Y(seg.t));seg=null}continue}if(!seg||seg.t!=x.top||seg.b!=x.bot){if(seg)g.fillRect(X(seg.a),Y(seg.t),X(i-1)-X(seg.a),Y(seg.b)-Y(seg.t));seg={a:i,t:x.top,b:x.bot}}}if(seg)g.fillRect(X(seg.a),Y(seg.t),X(e)-X(seg.a),Y(seg.b)-Y(seg.t));let bw=Math.max(1,(r.width-63)/(e-s+1)*.55);for(let i=s;i<=e;i++){let x=R[i],xx=X(i);g.strokeStyle=g.fillStyle=x.c>=x.o?'#43c59e':'#ef6b73';g.beginPath();g.moveTo(xx,Y(x.h));g.lineTo(xx,Y(x.l));g.stroke();g.fillRect(xx-bw/2,Math.min(Y(x.o),Y(x.c)),bw,Math.max(1,Math.abs(Y(x.o)-Y(x.c))))}}
function allView(){V=[0,W.length-1];draw()}function recent(){V=[Math.max(0,W.length-416),W.length-1];draw()}
async function load(){try{let t=await fetch(DATA).then(x=>{if(!x.ok)throw Error(x.status);return x.text()}),D=parse(t);W=week(D);recent();q('days').textContent=D.length.toLocaleString();q('weeks').textContent=W.length.toLocaleString();q('range').textContent=date(D[0].t)+' → '+date(D.at(-1).t);q('msg').textContent='藍色＝當時已確認的 v0.4c 支撐區。這版不含進出場，因此績效指標暫不計算。';calc()}catch(e){q('msg').innerHTML='<span class=err>資料載入失敗：'+e.message+'</span>'}}
let c=q('c');c.onpointerdown=e=>{drag=[e.clientX,...V];c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;let sp=drag[2]-drag[1],dx=(e.clientX-drag[0])/c.clientWidth*sp;V=[Math.max(0,drag[1]-dx),Math.min(W.length-1,drag[2]-dx)];draw()};c.onpointerup=()=>drag=null;c.onwheel=e=>{e.preventDefault();let sp=V[1]-V[0],m=V[0]+e.offsetX/c.clientWidth*sp,n=Math.max(30,Math.min(W.length,sp*(e.deltaY>0?1.2:.8)));V=[Math.max(0,m-n/2),Math.min(W.length-1,m+n/2)];draw()};window.onresize=draw;load();
</script></body></html>
