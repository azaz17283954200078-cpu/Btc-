name: Research Kernel checks

on:
  push:
    paths:
      - "index.html"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "data/**"
      - ".github/workflows/research-kernel-tests.yml"
  pull_request:
    paths:
      - "index.html"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "data/**"
      - ".github/workflows/research-kernel-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Research Kernel unit tests
        run: node tests/research-kernel.test.js
      - name: Shared Model Engine runtime
        run: node tests/model-engine.test.js
      - name: M5 Condition Engine semantics
        run: node tests/condition-engine.test.js
      - name: Research Runner parity and batch tests
        run: node tests/research-runner.test.js
      - name: M5 Runner conditional parity
        run: node tests/m5-runner.test.js
      - name: M5 real-market causality audit
        run: node scripts/m5-condition-audit.js
      - name: Market data sanity
        run: node tests/market-data.test.js
      - name: Pre-M4 regression baseline
        run: node tests/regression-audit.test.js
      - name: Strategy Lab architecture contract
        run: node tests/index-contract.test.js
      - name: M4 desktop/mobile guided research contract
        run: node tests/m4-ui-contract.test.js
      - name: M5 guided conditional UI contract
        run: node tests/m5-ui-contract.test.js
      - name: G01 single-model guidance contract
        run: node tests/g01-guidance-contract.test.js
      - name: G02-R1 single-model architecture contract
        run: node tests/g02-r1-single-model-contract.test.js
      - name: G02-R2 research safety UI contract
        run: node tests/g02-r2-research-safety-contract.test.js
      - name: G02-R2 research safety data audit
        run: node scripts/g02-r2-research-safety-audit.js
      - name: G02-R3 cross-model consistency contract
        run: node tests/g02-r3-consistency-contract.test.js
      - name: G02-R4 model-specific evidence contract
        run: node tests/g02-r4-model-proof-contract.test.js
      - name: G02-R5 saved research continuity contract
        run: node tests/g02-r5-saved-research-contract.test.js
      - name: G02-R6 combination entry contract
        run: node tests/g02-r6-combination-entry-contract.test.js
      - name: Validated model preset contract
        run: node tests/model-presets.test.js
      - name: M4 validated preset semantic gate
        run: node scripts/m4-preset-research.js
